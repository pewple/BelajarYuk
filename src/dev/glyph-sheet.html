<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lembar uji goresan (hanya untuk pengembangan)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 12px; background: #fff; color: #0f172a; }
      h2 { margin: 18px 0 6px; font-size: 16px; }
      .grid { display: flex; flex-wrap: wrap; gap: 8px; }
      figure { margin: 0; width: var(--cell, 150px); }
      figcaption { text-align: center; font-size: 12px; color: #475569; }
      svg { width: 100%; height: auto; background: #fff; border: 1px solid #cbd5e1; display: block; }
      .arabic { font-family: 'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', 'Geeza Pro', 'Segoe UI', Tahoma, Arial, sans-serif; }
    </style>
  </head>
  <body>
    <p>
      Lembar ini menggambar setiap glyph dari <code>src/data/glyphs*.ts</code> persis seperti di Menulis (abu-abu = jalur, garis hitam = garis tengah,
      angka = urutan goresan). Untuk huruf Arab, huruf asli dari font sistem digambar biru muda di belakangnya sebagai pembanding.
      Parameter: <code>?kind=hijaiyah&amp;size=260&amp;font=0</code>.
    </p>
    <div id="root"></div>
    <script type="module" src="./glyphSheet.ts"></script>
  </body>
</html>
