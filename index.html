<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffbeb" />
    <!-- "Add to Home Screen" then opens full-screen, without the browser bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Belajar Yuk" />
    <meta
      name="description"
      content="Belajar Yuk! - permainan belajar huruf, bicara, berhitung, pola, labirin, dan kasir dalam Bahasa Indonesia untuk balita usia 3 tahun."
    />
    <!-- Installable app: the manifest names it, the icons draw it, sw.js (written at build time) keeps it offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Belajar Yuk!</title>
    <!--
      Daftar suara dan gambar buatan sendiri (folder media/). Skrip biasa, bukan
      modul, supaya tetap terbaca saat index.html dibuka langsung dari folder.
      Dibuat ulang oleh Perbarui-Media.bat / `npm run media`.
    -->
    <script src="/media/manifest.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
