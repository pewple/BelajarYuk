# Netlify builds this site from GitHub on every push to `main`.
#
# The site is plain static files, so there is nothing to configure beyond
# "how to build it" and "where the result is". Everything else here is
# insurance against a bad deploy.

[build]
  # Tests first, then the build. If a test fails, the build stops, and Netlify
  # keeps serving the previous version - so a broken change can never replace a
  # working site that a child might be using. (Deploys are atomic: the old one
  # stays live until a new one succeeds completely.)
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ or 22.12+. Pinned here because Netlify's own
  # default moves over time and an older one fails with a confusing error.
  NODE_VERSION = "22"

# Built files carry a hash in their name (index-AbC123.js), so a changed file
# always has a new name and an unchanged one can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must be re-checked on every visit: it is the thing that
# delivers updates, so a long-cached copy of it would freeze every device on
# the version it first saw.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# Everything else (index.html, and media/ - the recordings, pictures and the
# manifest listing them) must be re-checked on every visit, or a new recording
# would not show up until the browser's cache happened to expire.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# A children's site should leak nothing about where a child came from or went.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
